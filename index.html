<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DevExplore: explore and compare public GitHub developers." />
    <meta name="author" content="Hassan Rupam" />
    <link rel="author" href="https://hassanrupam.vercel.app/" />
    <link rel="me" href="https://github.com/hassanrupam/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>DevExplore</title>
    <script>
      ;(() => {
        let savedTheme = null
        try {
          savedTheme = localStorage.getItem('devscope-theme')
        } catch (error) {
          console.warn('Could not read saved theme preference.', error)
        }
        const isDark = savedTheme === 'dark' || (savedTheme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', isDark)
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
